# NOTE: There is no CERTVERIFY in the config file,
# NOTE: so the upsmon will not verify the server certificate.
# NOTE: This is another vulnerability.
RUN_AS_USER root
MONITOR asustor@localhost 1 admin 1111 master
MINSUPPLIES 1
SHUTDOWNCMD ""
NOTIFYCMD /usr/sbin/upssched
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
POWERDOWNFLAG /etc/killpower
NOTIFYFLAG ONLINE EXEC
NOTIFYFLAG ONBATT EXEC
NOTIFYFLAG LOWBATT EXEC
NOTIFYFLAG COMMOK EXEC
NOTIFYFLAG COMMBAD EXEC
NOTIFYFLAG NOCOMM IGNORE
NOTIFYFLAG SHUTDOWN IGNORE
NOTIFYFLAG FSD IGNORE
NOTIFYFLAG NOPARENT SYSLOG
RBWARNTIME 43200
NOCOMMWARNTIME 300
FINALDELAY 5
