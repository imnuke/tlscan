[project]
name = "tlscan"
version = "0.1.0"
description = "TLS Security Analysis Tool for Firmware Binaries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "cxxfilt>=0.3.0",
    "ida-domain>=0.2.0",
    "idapro>=0.0.6",
    "langchain>=1.0.1",
    "langchain-anthropic>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "langchain-mcp-adapters>=0.1.11",
    "langchain-openai>=1.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=0.2.0",
    "networkx>=3.5",
    "numpy>=2.0.0",
    "pyelftools>=0.32",
    "pygraphviz",
    "pyyaml>=6.0.0",
    "rich>=14.1.0",
    "tiktoken>=0.8.0",
]

[project.scripts]
tlscan = "tlscan.analyzer.cli:run"
tlscan-detect = "tlscan.scanner.cli:main"
tlscan-rulegen = "tlscan.rulegen.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tlscan.rules" = ["*.md"]

[tool.uv.sources]
pygraphviz = { git = "https://github.com/pygraphviz/pygraphviz.git", rev = "2fa8af802aeecfe92e53425c2503587de9593d9e" }
