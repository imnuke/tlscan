library: openssl
functions:
  - name: SSL_CTX_new
    type: "void *SSL_CTX_new(const void *method)"
    comment: "Create a new SSL_CTX object"
  - name: SSL_CTX_set_verify
    type: "void SSL_CTX_set_verify(void *ctx, int mode, void *verify_callback)"
    comment: "Set peer certificate verification mode"
  - name: SSL_CTX_set_verify_depth
    type: "void SSL_CTX_set_verify_depth(void *ctx, int depth)"
    comment: "Set maximum certificate chain depth"
  - name: SSL_CTX_load_verify_locations
    type: "int SSL_CTX_load_verify_locations(void *ctx, const char *CAfile, const char *CApath)"
    comment: "Load CA certificates for verification"
  - name: SSL_CTX_set_cipher_list
    type: "int SSL_CTX_set_cipher_list(void *ctx, const char *str)"
    comment: "Set TLS 1.2 and earlier cipher list"
  - name: SSL_CTX_set_ciphersuites
    type: "int SSL_CTX_set_ciphersuites(void *ctx, const char *str)"
    comment: "Set TLS 1.3 cipher suite list"
  - name: SSL_CTX_set_min_proto_version
    type: "int SSL_CTX_set_min_proto_version(void *ctx, int version)"
    comment: "Set minimum protocol version"
  - name: SSL_CTX_set_max_proto_version
    type: "int SSL_CTX_set_max_proto_version(void *ctx, int version)"
    comment: "Set maximum protocol version"
  - name: SSL_CTX_set_options
    type: "long SSL_CTX_set_options(void *ctx, long options)"
    comment: "Set SSL context options (e.g. SSL_OP_NO_SSLv3)"
  - name: SSL_connect
    type: "int SSL_connect(void *ssl)"
    comment: "Initiate TLS/SSL handshake with server"
  - name: SSL_get_verify_result
    type: "long SSL_get_verify_result(const void *ssl)"
    comment: "Get result of peer certificate verification"
  - name: SSL_CTX_set_default_verify_paths
    type: "int SSL_CTX_set_default_verify_paths(void *ctx)"
    comment: "Load default CA certificate locations"
